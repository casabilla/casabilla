<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Gallery</title>
    <link rel="stylesheet" href="gallery_style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:wght@400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="gallery-page">
        <a href="index.html" class="gallery-back-btn">
            <img src="arrow icon.png" alt="back">
        </a>
        <h1 class="gallery-title">gallery</h1>
        
        <div class="gallery-grid">
            <!-- Вертикальные фото -->
            <div class="polaroid vertical photo_together" style="top: 0px; left: 10px; transform: rotate(-3deg); z-index: 3;">
                <img src="photo_together.jpg" alt="together">
            </div>
            
            <div class="polaroid vertical photo_river" style="top: 15px; left: 140px; transform: rotate(4deg); z-index: 2;">
                <img src="photo_river.jpg" alt="river">
            </div>
            
            <div class="polaroid vertical photo_sunset" style="top: 150px; left: -20px; transform: rotate(-2deg); z-index: 1;">
                <img src="photo_sunset.jpg" alt="sunset">
            </div>
            
            <div class="polaroid vertical small" style="top: 80px; left: 250px; transform: rotate(-6deg); z-index: 4;">
                <img src="photo_forest.jpg" alt="forest">
            </div>
            
            <div class="polaroid vertical small" style="top: 400px; left: 80px; transform: rotate(-5deg); z-index: 2;">
                <img src="photo_crazy_eyes.jpg" alt="crazy eyes">
            </div>
             
            <div class="polaroid vertical photo_black_jacket" style="top: 230px; left: 130px; transform: rotate(2deg); z-index: 3;">
                <img src="photo_black_jacket.jpg" alt="black jacket">
            </div>
            
            <div class="polaroid vertical small" style="top: 300px; left: 270px; transform: rotate(-4deg); z-index: 1;">
                <img src="photo_cute.jpg" alt="cute">
            </div>
            
            <div class="polaroid vertical Picture_4" style="top: 480px; left: 20px; transform: rotate(-2deg); z-index: 3;">
                <img src="Picture_4.jpg" alt="picture 4">
            </div>
            
             <div class="polaroid vertical Picture_1" style="top: 450px; left: 160px; transform: rotate(3deg); z-index: 3;">
                <img src="Picture_1.jpg" alt="picture 1">
            </div>

            <div class="polaroid vertical Picture_6" style="top: 400px; left: 250px; transform: rotate(-5deg); z-index: 1;">
                <img src="Picture_6.jpg" alt="picture 6">
            </div>
            
            <!-- Горизонтальные фото -->
            <div class="polaroid horizontal Picture_2" style="top: 670px; left: -30px; transform: rotate(-6deg); z-index: 2;">
                <img src="Picture_2.jpg" alt="picture 2">
            </div>
            
            <div class="polaroid horizontal Picture_3" style="top: 680px; left: 190px; transform: rotate(4deg); z-index: 3;">
                <img src="Picture_3.jpg" alt="picture 3">
            </div>
        </div>
    </div>
</body>
</html>
