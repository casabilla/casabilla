<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>HB</title>
    <link rel="stylesheet" href="main_style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:wght@400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Фоновый слой old paper pic -->
        <div class="layer old-paper">
            <img src="old paper pic.jpg" alt="old paper background">
        </div>

        <!-- Слой balloons -->
        <div class="layer balloons">
            <img src="silver baloons star.png">
        </div>
        
        <!-- Слой happy bd -->
        <div class="layer happy-bd">
            <img src="happy bd.png" alt="happy birthday">
        </div>
        
        <!-- Слой Picture_5 -->
        <div class="layer picture5">
            <img src="Picture_5.jpg" alt="picture 5">
        </div>
        
        <!-- Слой camera no background (первый экземпляр) -->
        <div class="layer camera">
            <img src="camera no background.png" alt="camera">
        </div>
        
        <!-- Слой uno card -->
        <div class="layer uno">
            <img src="red love you uno.jpg" alt="camera">
        </div>

        <!-- Слой heart sticker -->
        <div class="layer heart">
            <img src="heart sticker.png" alt="heart sticker">
        </div>
        
        <!-- Слой fire sticker -->
        <div class="layer fire">
            <img src="fire sticker.png" alt="fire sticker">
        </div>
        
        <!-- Слой cake sticker -->
        <div class="layer cake">
            <img src="cake sticker.png" alt="cake sticker">
        </div>
        
        <!-- Слой discoball -->
        <div class="layer discoball">
            <img src="discoball 2.png" alt="discoball">
        </div>
        
        <!-- Слой flags -->
        <div class="layer flags">
            <img src="flags.png" alt="flags">
        </div>
        
        <!-- Слой candles icon (кликабельный) -->
        <div class="layer candles-icon" id="candlesIcon">
            <img src="candles icon.png" alt="candles icon">
        </div>

        <!-- Меню (изначально скрыто) -->
        <div class="menu-overlay" id="menuOverlay">
            <div class="menu-panel">
                <!-- Фоновый слой меню -->
                <div class="menu-bg">
                    <img src="old paper pic.jpg" alt="menu background">
                </div>
                <!-- Стрелка закрытия -->
                <div class="menu-arrow" id="menuArrow">
                    <img src="arrow icon.png" alt="arrow icon">
                </div>
                <!-- Иконка свечей в меню (возврат на главную) -->
                <div class="menu-candles" id="menuCandles">
                    <img src="candles icon.png" alt="candles icon">
                </div>
                <!-- Разделительные линии -->
                <div class="menu-line line1"></div>
                <div class="menu-line line2"></div>
                <div class="menu-line line3"></div>
                <div class="menu-line line4"></div>
                <!-- Пункты меню -->
                <div class="menu-item item-gallery" id="menuGallery">gallery</div>
                <div class="menu-item item-who" id="menuWho">who are you from...?</div>
                <div class="menu-item item-letters" id="menuLetters">letters</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
